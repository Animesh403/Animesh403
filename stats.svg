<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 220" width="100%" height="100%">
  <style>
    .bg { fill: #0f172a; stroke: #1e293b; stroke-width: 2px; rx: 12px; }
    .text-title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #38bdf8; }
    .text-label { font-family: monospace; font-size: 13px; fill: #94a3b8; }
    .text-val { font-family: monospace; font-size: 13px; font-weight: bold; fill: #f8fafc; }
    
    @keyframes strokeAnim {
      0% { stroke-dashoffset: 283; }
      100% { stroke-dashoffset: 45; }
    }
    .rank-ring {
      stroke-dasharray: 283;
      stroke-dashoffset: 283;
      animation: strokeAnim 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
  </style>

  <rect width="450" height="220" class="bg" />

  <!-- Rank Ring -->
  <g transform="translate(80, 110)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#1e293b" stroke-width="8"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#ff007f" stroke-width="8" stroke-linecap="round" class="rank-ring" transform="rotate(-90)"/>
    <text x="0" y="6" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="900" fill="#ffffff">A+</text>
  </g>

  <!-- Title -->
  <text x="160" y="40" class="text-title">Animesh's GitHub Stats</text>

  <!-- Stat Rows -->
  <g transform="translate(160, 75)">
    <text x="0" y="0" class="text-label">Total Stars Earned:</text>
    <text x="210" y="0" text-anchor="end" class="text-val">128</text>

    <text x="0" y="30" class="text-label">Total Commits (2026):</text>
    <text x="210" y="30" text-anchor="end" class="text-val">842</text>

    <text x="0" y="60" class="text-label">Total PRs:</text>
    <text x="210" y="60" text-anchor="end" class="text-val">64</text>

    <text x="0" y="90" class="text-label">Contributed to:</text>
    <text x="210" y="90" text-anchor="end" class="text-val">18 repos</text>
  </g>
</svg>

