<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <linearGradient id="strap-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.95)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.98)"/>
    </linearGradient>

    <linearGradient id="shine-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <clipPath id="avatar-clip">
      <circle cx="250" cy="270" r="50"/>
    </clipPath>
  </defs>

  <style>
    /* Pendulum Swinging Physics Animation */
    @keyframes lanyardSwing {
      0% { transform: rotate(-15deg); }
      20% { transform: rotate(12deg); }
      40% { transform: rotate(-8deg); }
      60% { transform: rotate(5deg); }
      80% { transform: rotate(-2deg); }
      100% { transform: rotate(0deg); }
    }
    
    @keyframes gentleSway {
      0%, 100% { transform: rotate(-1.5deg); }
      50% { transform: rotate(1.5deg); }
    }

    .lanyard-assembly {
      transform-origin: 250px 0px;
      animation: lanyardSwing 2.5s ease-out 0s 1, gentleSway 4s ease-in-out 2.5s infinite;
    }

    /* Holographic Shine Sweep */
    @keyframes shineSweep {
      0% { transform: translateX(-300px) translateY(-300px); }
      100% { transform: translateX(300px) translateY(300px); }
    }
    .shine { animation: shineSweep 4s linear infinite; }
    .text-mono { font-family: monospace; }
    .text-sans { font-family: sans-serif; }
  </style>

  <!-- Entire Assembly Suspended from Top Center -->
  <g class="lanyard-assembly">
    <!-- Blue Lanyard Straps -->
    <path d="M 235 0 L 235 140 L 245 140 L 245 0 Z" fill="url(#strap-grad)"/>
    <path d="M 265 0 L 265 140 L 255 140 L 255 0 Z" fill="url(#strap-grad)"/>

    <!-- Strap Text & Cute Cat Paws Pattern -->
    <text x="240" y="70" font-size="10" fill="#ffffff" font-weight="bold" transform="rotate(-90 240 70)">ANIMESH BEHERA 🐾</text>
    <text x="260" y="70" font-size="10" fill="#ffffff" font-weight="bold" transform="rotate(90 260 70)">DATA SCIENCE 🐾</text>

    <!-- Metal Clasp & Ring -->
    <rect x="230" y="135" width="40" height="12" rx="3" fill="#94a3b8"/>
    <circle cx="250" cy="155" r="10" fill="none" stroke="#94a3b8" stroke-width="4"/>

    <!-- ID Badge Card -->
    <g transform="translate(130, 165)">
      <!-- Card Base -->
      <rect width="240" height="360" rx="16" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="2"/>
      
      <!-- Lanyard Hole Slot -->
      <rect x="100" y="12" width="40" height="8" rx="4" fill="#0f172a"/>

      <!-- Glowing Avatar Ring -->
      <circle cx="120" cy="105" r="54" fill="none" stroke="#ff007f" stroke-width="3"/>

      <!-- Cat Vector Avatar -->
      <g clip-path="url(#avatar-clip)">
        <rect x="170" y="220" width="100" height="100" fill="#1e293b"/>
        <!-- Simple Cat Representation inside Badge -->
        <circle cx="250" cy="270" r="35" fill="#0f172a"/>
        <ellipse cx="240" cy="265" rx="6" ry="8" fill="#facc15"/>
        <ellipse cx="260" cy="265" rx="6" ry="8" fill="#facc15"/>
        <polygon points="248,275 252,275 250,278" fill="#f43f5e"/>
      </g>

      <!-- Badge Info Text -->
      <text class="text-sans" x="120" y="190" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">Animesh Behera</text>
      <text class="text-mono" x="120" y="212" text-anchor="middle" font-size="13" fill="#38bdf8">@Animesh403</text>
      
      <rect x="30" y="228" width="180" height="2" fill="#334155"/>

      <text class="text-mono" x="120" y="252" text-anchor="middle" font-size="12" fill="#94a3b8">ROLE</text>
      <text class="text-sans" x="120" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#f43f5e">Data Science &amp; n8n</text>

      <!-- Barcode Animation -->
      <g transform="translate(45, 295)" fill="#ffffff">
        <rect x="0" width="3" height="30"/><rect x="5" width="1" height="30"/><rect x="8" width="4" height="30"/>
        <rect x="15" width="2" height="30"/><rect x="20" width="5" height="30"/><rect x="28" width="1" height="30"/>
        <rect x="32" width="3" height="30"/><rect x="38" width="2" height="30"/><rect x="43" width="6" height="30"/>
        <rect x="52" width="1" height="30"/><rect x="56" width="4" height="30"/><rect x="63" width="2" height="30"/>
        <rect x="68" width="5" height="30"/><rect x="76" width="1" height="30"/><rect x="80" width="3" height="30"/>
        <rect x="86" width="4" height="30"/><rect x="93" width="2" height="30"/><rect x="98" width="5" height="30"/>
        <rect x="106" width="2" height="30"/><rect x="111" width="3" height="30"/><rect x="117" width="1" height="30"/>
        <rect x="121" width="4" height="30"/><rect x="128" width="2" height="30"/><rect x="133" width="5" height="30"/>
        <rect x="141" width="2" height="30"/><rect x="146" width="4" height="30"/>
      </g>

      <!-- Holographic Shine Overlay -->
      <rect width="240" height="360" rx="16" fill="url(#shine-grad)" class="shine" pointer-events="none"/>
    </g>
  </g>
</svg>

