<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="name-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb">
        <animate attributeName="stop-color" values="#2563eb;#7c3aed;#db2777;#2563eb" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#db2777;#2563eb;#7c3aed" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="scan-glow-light">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="banner-clip-light">
      <rect x="0" y="0" width="1280" height="740" rx="20" ry="20" />
    </clipPath>
  </defs>

  <style>
    .text-mono { font-family: 'Fira Code', 'Courier New', monospace; }
    .text-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    @keyframes letterPop {
      0% { opacity: 0; transform: translateY(15px) scale(0.8); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .char { animation: letterPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    .pill-light { transition: transform 0.3s ease; fill: #e2e8f0; stroke: #cbd5e1; stroke-width: 1px; }
    .pill-light:hover { transform: translateY(-3px); fill: #cbd5e1; stroke: #2563eb; }

    @keyframes scanSweep {
      0% { transform: translateY(0px); }
      100% { transform: translateY(740px); }
    }
    .scan-line { animation: scanSweep 3.5s linear infinite; }
  </style>

  <g clip-path="url(#banner-clip-light)">
    <rect width="1280" height="740" fill="url(#bg-light)" />

    <!-- Terminal Line -->
    <g transform="translate(60, 60)">
      <text class="text-mono" font-size="20" fill="#475569">
        <tspan fill="#16a34a">user@dev</tspan>:<tspan fill="#2563eb">~$</tspan> cat README.md
      </text>
      <rect x="295" y="-16" width="10" height="22" fill="#16a34a">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Name -->
    <g transform="translate(60, 130)">
      <text font-family="'Brush Script MT', 'cursive', sans-serif" font-size="78" font-weight="bold" fill="url(#name-grad-light)">
        <tspan class="char" style="animation-delay: 0.1s;">A</tspan>
        <tspan class="char" style="animation-delay: 0.2s;">n</tspan>
        <tspan class="char" style="animation-delay: 0.3s;">i</tspan>
        <tspan class="char" style="animation-delay: 0.4s;">m</tspan>
        <tspan class="char" style="animation-delay: 0.5s;">e</tspan>
        <tspan class="char" style="animation-delay: 0.6s;">s</tspan>
        <tspan class="char" style="animation-delay: 0.7s;">h</tspan>
<tspan class="char" style="animation-delay: 0.8s;"> </tspan>
<tspan x="0" dy="1.2em" class="char" style="animation-delay: 0.9s;">B</tspan>
        <tspan class="char" style="animation-delay: 1.0s;">e</tspan>
        <tspan class="char" style="animation-delay: 1.1s;">h</tspan>
        <tspan class="char" style="animation-delay: 1.2s;">e</tspan>
        <tspan class="char" style="animation-delay: 1.3s;">r</tspan>
        <tspan class="char" style="animation-delay: 1.4s;">a</tspan>
      </text>
    </g>

    <!-- Cycling Roles -->
    <g transform="translate(60, 220)">
      <text class="text-mono" font-size="28" fill="#2563eb" font-weight="600">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite"/>
        &gt; Data Scientist &amp; AI Architect
      </text>
      <text class="text-mono" font-size="28" fill="#db2777" font-weight="600">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite"/>
        &gt; n8n Workflow Specialist
      </text>
    </g>

    <!-- Quote Box -->
    <g transform="translate(60, 280)">
      <rect x="0" y="0" width="480" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <text class="text-mono" x="20" y="36" font-size="18" fill="#d97706" font-weight="bold">
        🐾 &quot;CATS ARE CUTE&quot;
      </text>
    </g>

    <!-- Tech Stack Pills -->
    <g transform="translate(60, 370)">
      <g class="pill-light" transform="translate(0, 0)"><rect width="90" height="36" rx="18"/><text class="text-sans" x="45" y="23" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="bold">n8n</text></g>
      <g class="pill-light" transform="translate(105, 0)"><rect width="130" height="36" rx="18"/><text class="text-sans" x="65" y="23" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="bold">Data Science</text></g>
      <g class="pill-light" transform="translate(250, 0)"><rect width="100" height="36" rx="18"/><text class="text-sans" x="50" y="23" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="bold">Python</text></g>
      <g class="pill-light" transform="translate(365, 0)"><rect width="140" height="36" rx="18"/><text class="text-sans" x="70" y="23" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="bold">Android Studio</text></g>
      <g class="pill-light" transform="translate(0, 50)"><rect width="90" height="36" rx="18"/><text class="text-sans" x="45" y="23" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="bold">OSINT</text></g>
      <g class="pill-light" transform="translate(105, 50)"><rect width="90" height="36" rx="18"/><text class="text-sans" x="45" y="23" text-anchor="middle" fill="#1e293b" font-size="14" font-weight="bold">C / C++</text></g>
    </g>

    <!-- About Me Lines -->
    <g transform="translate(60, 490)" class="text-sans" font-size="16" fill="#334155">
      <text x="0" y="0">⚡ Building autonomous workflows &amp; intelligent pipelines.</text>
      <text x="0" y="30">🔍 Open Source Intelligence (OSINT) &amp; Security Enthusiast.</text>
      <text x="0" y="60">📱 Android App Developer &amp; Low-Level C/C++ Optimization.</text>
    </g>

    <!-- Neon Sign -->
    <g transform="translate(60, 630)">
      <rect x="0" y="0" width="480" height="55" rx="8" fill="#ffffff" stroke="#db2777" stroke-width="2"/>
      <text class="text-mono" x="240" y="36" text-anchor="middle" font-size="22" font-weight="900" fill="#db2777">
        ⚡ LIFE IS A CODE ⚡
      </text>
    </g>

    <!-- Code Editor Card -->
    <g transform="translate(680, 80)">
      <rect width="540" height="420" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="25" cy="25" r="6" fill="#ef4444"/>
      <circle cx="45" cy="25" r="6" fill="#f59e0b"/>
      <circle cx="65" cy="25" r="6" fill="#10b981"/>
      <text class="text-mono" x="270" y="28" text-anchor="middle" font-size="13" fill="#94a3b8">buildMemories.jsx</text>
      <line x1="0" y1="45" x2="540" y2="45" stroke="#e2e8f0" stroke-width="1.5"/>

      <g transform="translate(25, 80)" class="text-mono" font-size="14" fill="#0f172a">
        <text x="0" y="0"><tspan fill="#e11d48">const</tspan> <tspan fill="#2563eb">buildMemories</tspan> = () =&gt; {</text>
        <text x="20" y="35"><tspan fill="#e11d48">const</tspan> stack = [<tspan fill="#0284c7">&quot;Data Science&quot;</tspan>, <tspan fill="#0284c7">&quot;n8n&quot;</tspan>];</text>
        <text x="20" y="70"><tspan fill="#e11d48">const</tspan> passion = <tspan fill="#0284c7">&quot;CATS ARE CUTE&quot;</tspan>;</text>
        <text x="20" y="120"><tspan fill="#9333ea">return</tspan> (</text>
        <text x="40" y="155" fill="#16a34a">&lt;Developer&gt;</text>
        <text x="60" y="190"><tspan fill="#ca8a04">name</tspan>=<tspan fill="#0284c7">&quot;Animesh Behera&quot;</tspan></text>
        <text x="60" y="225"><tspan fill="#ca8a04">status</tspan>=<tspan fill="#0284c7">&quot;Automating the Future&quot;</tspan></text>
        <text x="40" y="260" fill="#16a34a">/&gt;</text>
        <text x="20" y="295">);</text>
        <text x="0" y="330">};</text>
      </g>
    </g>

    <!-- Stats Bar -->
    <g transform="translate(680, 630)">
      <rect width="540" height="55" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
      <text class="text-mono" x="25" y="33" font-size="14" fill="#475569">AUTOMATION: 98%</text>
      <rect x="175" y="20" width="330" height="16" rx="8" fill="#e2e8f0"/>
      <rect x="175" y="20" width="320" height="16" rx="8" fill="url(#name-grad-light)"/>
    </g>

    <line x1="0" y1="0" x2="1280" y2="0" stroke="#2563eb" stroke-width="3" filter="url(#scan-glow-light)" opacity="0.5" class="scan-line"/>
  </g>
</svg>

