<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 220" width="100%" height="100%">
  <style>
    .bg { fill: #0f172a; stroke: #1e293b; stroke-width: 2px; rx: 12px; }
    .text-title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #38bdf8; }
    .text-lang { font-family: monospace; font-size: 13px; fill: #e2e8f0; }
    
    @keyframes fillBar {
      0% { width: 0; }
    }
    .bar { animation: fillBar 1.5s ease-out forwards; }
  </style>

  <rect width="450" height="220" class="bg" />
  <text x="30" y="40" class="text-title">Most Used Languages</text>

  <g transform="translate(30, 70)">
    <!-- Python -->
    <text x="0" y="15" class="text-lang">Python</text>
    <rect x="100" y="4" width="280" height="12" rx="6" fill="#1e293b"/>
    <rect x="100" y="4" width="150" height="12" rx="6" fill="#3572A5" class="bar"/>
    <text x="390" y="15" class="text-lang">52%</text>

    <!-- C/C++ -->
    <text x="0" y="45" class="text-lang">C / C++</text>
    <rect x="100" y="34" width="280" height="12" rx="6" fill="#1e293b"/>
    <rect x="100" y="34" width="75" height="12" rx="6" fill="#f34b7d" class="bar"/>
    <text x="390" y="45" class="text-lang">26%</text>

    <!-- JavaScript / n8n -->
    <text x="0" y="75" class="text-lang">n8n / JS</text>
    <rect x="100" y="64" width="280" height="12" rx="6" fill="#1e293b"/>
    <rect x="100" y="64" width="40" height="12" rx="6" fill="#f1e05a" class="bar"/>
    <text x="390" y="75" class="text-lang">14%</text>

    <!-- Java / Android -->
    <text x="0" y="105" class="text-lang">Java</text>
    <rect x="100" y="94" width="280" height="12" rx="6" fill="#1e293b"/>
    <rect x="100" y="94" width="25" height="12" rx="6" fill="#b07219" class="bar"/>
    <text x="390" y="105" class="text-lang">8%</text>
  </g>
</svg>

