<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#121629"/>
      <stop offset="100%" stop-color="#05060b"/>
    </linearGradient>

    <!-- Animated Name Gradient -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e90ff">
        <animate attributeName="stop-color" values="#1e90ff;#8a2be2;#ff007f;#1e90ff" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8a2be2">
        <animate attributeName="stop-color" values="#8a2be2;#ff007f;#1e90ff;#8a2be2" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanner Glow -->
    <filter id="scan-glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip Path for Rounded Banner -->
    <clipPath id="banner-clip">
      <rect x="0" y="0" width="1280" height="740" rx="20" ry="20" />
    </clipPath>
  </defs>

  <style>
    .text-mono { font-family: 'Fira Code', 'Courier New', monospace; }
    .text-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    /* Letter Pop In */
    @keyframes letterPop {
      0% { opacity: 0; transform: translateY(15px) scale(0.8); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .char { animation: letterPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    /* Flicker animation for neon */
    @keyframes neonFlicker {
      0%, 100% { opacity: 1; }
      3% { opacity: 0.4; }
      6% { opacity: 1; }
      7% { opacity: 0.2; }
      8% { opacity: 0.9; }
      9% { opacity: 0.4; }
      10% { opacity: 1; }
      89% { opacity: 1; }
      90% { opacity: 0.3; }
      100% { opacity: 1; }
    }
    .neon-text { animation: neonFlicker 5s infinite; }

    /* Tech Stack Pills Hover Effect via CSS */
    .pill { transition: transform 0.3s ease; fill: #1e2640; stroke: #3b82f6; stroke-width: 1px; }
    .pill:hover { transform: translateY(-3px); fill: #2d3748; stroke: #ff007f; }

    /* Continuous Scanner Sweep */
    @keyframes scanSweep {
      0% { transform: translateY(0px); }
      100% { transform: translateY(740px); }
    }
    .scan-line { animation: scanSweep 3.5s linear infinite; }

    /* Sparkles &amp; Floating Treats */
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.2; }
      50% { transform: translateY(-20px) rotate(180deg); opacity: 0.8; }
      100% { transform: translateY(0px) rotate(360deg); opacity: 0.2; }
    }
    .floating { animation: floatParticle 6s ease-in-out infinite; }
  </style>

  <g clip-path="url(#banner-clip)">
    <!-- Dark Background -->
    <rect width="1280" height="740" fill="url(#bg)" />

    <!-- Ambient Pulsing Orbs -->
    <circle cx="200" cy="150" r="180" fill="#3b82f6" opacity="0.15">
      <animate attributeName="r" values="150;210;150" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.25;0.1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="550" r="220" fill="#8a2be2" opacity="0.12">
      <animate attributeName="r" values="180;240;180" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.08;0.2;0.08" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- Floating Fish Treats &amp; Sparkles -->
    <g class="floating" style="animation-delay: 0s;">
      <path d="M100 120 C 110 110, 130 110, 140 120 C 130 130, 110 130, 100 120 Z M 140 120 L 150 112 L 150 128 Z" fill="#ff007f" opacity="0.4"/>
    </g>
    <g class="floating" style="animation-delay: 2s;">
      <path d="M1150 200 C 1160 190, 1180 190, 1190 200 C 1180 210, 1160 210, 1150 200 Z M 1190 200 L 1200 192 L 1200 208 Z" fill="#3b82f6" opacity="0.4"/>
    </g>
    <!-- Sparkles -->
    <path d="M 600 80 Q 600 90 610 90 Q 600 90 600 100 Q 600 90 590 90 Q 600 90 600 80 Z" fill="#fff" opacity="0.6" class="floating" style="animation-delay: 1s;"/>
    <path d="M 950 480 Q 950 490 960 490 Q 950 490 950 500 Q 950 490 940 490 Q 950 490 950 480 Z" fill="#3b82f6" opacity="0.7" class="floating" style="animation-delay: 3s;"/>

    <!-- Terminal Line Header -->
    <g transform="translate(60, 60)">
      <text class="text-mono" font-size="20" fill="#a0aec0">
        <tspan fill="#4ade80">user@dev</tspan>:<tspan fill="#60a5fa">~$</tspan> cat README.md
      </text>
      <!-- Blinking Cursor -->
      <rect x="295" y="-16" width="10" height="22" fill="#4ade80">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Vectorized Script Name (Vector Outlines) -->
    <g transform="translate(60, 130)">
      <text font-family="'Brush Script MT', 'cursive', sans-serif" font-size="78" font-weight="bold" fill="url(#name-grad)">
        <tspan class="char" style="animation-delay: 0.1s;">A</tspan>
        <tspan class="char" style="animation-delay: 0.2s;">n</tspan>
        <tspan class="char" style="animation-delay: 0.3s;">i</tspan>
        <tspan class="char" style="animation-delay: 0.4s;">m</tspan>
        <tspan class="char" style="animation-delay: 0.5s;">e</tspan>
        <tspan class="char" style="animation-delay: 0.6s;">s</tspan>
        <tspan class="char" style="animation-delay: 0.7s;">h</tspan>
<tspan class="char" style="animation-delay: 0.8s;"> </tspan>
<tspan x="0" dy="1.2em" class="char" style="animation-delay: 0.9s;">B</tspan>
        <tspan class="char" style="animation-delay: 1.0s;">e</tspan>
        <tspan class="char" style="animation-delay: 1.1s;">h</tspan>
        <tspan class="char" style="animation-delay: 1.2s;">e</tspan>
        <tspan class="char" style="animation-delay: 1.3s;">r</tspan>
        <tspan class="char" style="animation-delay: 1.4s;">a</tspan>
      </text>
    </g>

    <!-- Cycling Typed Role Titles -->
    <g transform="translate(60, 220)">
      <rect x="-10" y="-35" width="600" height="80" fill="none"/>
      <text class="text-mono" font-size="28" fill="#60a5fa" font-weight="600">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite"/>
        &gt; Data Scientist &amp; AI Architect
      </text>
      <text class="text-mono" font-size="28" fill="#ff007f" font-weight="600">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="6s" repeatCount="indefinite"/>
        &gt; n8n Workflow Specialist
      </text>
    </g>

    <!-- Tagline Typed Quote Box -->
    <g transform="translate(60, 280)">
      <rect x="0" y="0" width="480" height="60" rx="10" fill="#151b2e" stroke="#2d3748" stroke-width="1.5"/>
      <text class="text-mono" x="20" y="36" font-size="18" fill="#f6ad55" font-weight="bold">
        🐾 &quot;CATS ARE CUTE&quot;
      </text>
    </g>

    <!-- Tech Stack Pills -->
    <g transform="translate(60, 370)">
      <!-- Pill 1: n8n -->
      <g class="pill" transform="translate(0, 0)">
        <rect width="90" height="36" rx="18"/>
        <text class="text-sans" x="45" y="23" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">n8n</text>
      </g>
      <!-- Pill 2: Data Science -->
      <g class="pill" transform="translate(105, 0)">
        <rect width="130" height="36" rx="18"/>
        <text class="text-sans" x="65" y="23" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">Data Science</text>
      </g>
      <!-- Pill 3: Python -->
      <g class="pill" transform="translate(250, 0)">
        <rect width="100" height="36" rx="18"/>
        <text class="text-sans" x="50" y="23" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">Python</text>
      </g>
      <!-- Pill 4: Android Studio -->
      <g class="pill" transform="translate(365, 0)">
        <rect width="140" height="36" rx="18"/>
        <text class="text-sans" x="70" y="23" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">Android Studio</text>
      </g>
      <!-- Pill 5: OSINT -->
      <g class="pill" transform="translate(0, 50)">
        <rect width="90" height="36" rx="18"/>
        <text class="text-sans" x="45" y="23" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">OSINT</text>
      </g>
      <!-- Pill 6: C/C++ -->
      <g class="pill" transform="translate(105, 50)">
        <rect width="90" height="36" rx="18"/>
        <text class="text-sans" x="45" y="23" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="bold">C / C++</text>
      </g>
    </g>

    <!-- About Me Lines -->
    <g transform="translate(60, 490)" class="text-sans" font-size="16" fill="#cbd5e1">
      <text x="0" y="0">⚡ Building autonomous workflows &amp; intelligent pipelines.</text>
      <text x="0" y="30">🔍 Open Source Intelligence (OSINT) &amp; Security Enthusiast.</text>
      <text x="0" y="60">📱 Android App Developer &amp; Low-Level C/C++ Optimization.</text>
    </g>

    <!-- Neon Sign "LIFE IS A CODE" -->
    <g transform="translate(60, 630)">
      <rect x="0" y="0" width="480" height="55" rx="8" fill="#080a10" stroke="#ff007f" stroke-width="2" filter="url(#neon-glow)"/>
      <text class="text-mono neon-text" x="240" y="36" text-anchor="middle" font-size="22" font-weight="900" fill="#ff007f" filter="url(#neon-glow)">
        ⚡ LIFE IS A CODE ⚡
      </text>
    </g>

    <!-- Code Editor Card -->
    <g transform="translate(680, 80)">
      <rect width="540" height="420" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
      <!-- Window Buttons -->
      <circle cx="25" cy="25" r="6" fill="#ef4444"/>
      <circle cx="45" cy="25" r="6" fill="#f59e0b"/>
      <circle cx="65" cy="25" r="6" fill="#10b981"/>
      <text class="text-mono" x="270" y="28" text-anchor="middle" font-size="13" fill="#64748b">buildMemories.jsx</text>
      <line x1="0" y1="45" x2="540" y2="45" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Code Content -->
      <g transform="translate(25, 80)" class="text-mono" font-size="14" fill="#e2e8f0">
        <text x="0" y="0"><tspan fill="#f43f5e">const</tspan> <tspan fill="#60a5fa">buildMemories</tspan> = () =&gt; {</text>
        <text x="20" y="35"><tspan fill="#f43f5e">const</tspan> stack = [<tspan fill="#38bdf8">&quot;Data Science&quot;</tspan>, <tspan fill="#38bdf8">&quot;n8n&quot;</tspan>];</text>
        <text x="20" y="70"><tspan fill="#f43f5e">const</tspan> passion = <tspan fill="#38bdf8">&quot;CATS ARE CUTE&quot;</tspan>;</text>
        <text x="20" y="120"><tspan fill="#c084fc">return</tspan> (</text>
        <text x="40" y="155" fill="#4ade80">&lt;Developer&gt;</text>
        <text x="60" y="190"><tspan fill="#facc15">name</tspan>=<tspan fill="#38bdf8">&quot;Animesh Behera&quot;</tspan></text>
        <text x="60" y="225"><tspan fill="#facc15">status</tspan>=<tspan fill="#38bdf8">&quot;Automating the Future&quot;</tspan></text>
        <text x="40" y="260" fill="#4ade80">/&gt;</text>
        <text x="20" y="295">);</text>
        <text x="0" y="330">};</text>
      </g>
    </g>

    <!-- Animated Cat Head -->
    <g transform="translate(900, 520)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-8 0 80; 8 0 80; -8 0 80" dur="3s" repeatCount="indefinite" ease="sine-in-out"/>
        
        <!-- Ears -->
        <polygon points="-50,-10 -25,-60 0,-20" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
        <polygon points="-42,-15 -25,-50 -5,-22" fill="#f43f5e"/>
        
        <polygon points="50,-10 25,-60 0,-20" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
        <polygon points="42,-15 25,-50 5,-22" fill="#f43f5e"/>

        <!-- Head Base -->
        <ellipse cx="0" cy="10" rx="55" ry="45" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>

        <!-- Eyes -->
        <ellipse cx="-20" cy="0" rx="12" ry="16" fill="#facc15"/>
        <circle cx="-18" cy="0" r="6" fill="#000"/>
        
        <ellipse cx="20" cy="0" rx="12" ry="16" fill="#facc15"/>
        <circle cx="22" cy="0" r="6" fill="#000"/>

        <!-- Snout &amp; Nose -->
        <polygon points="-4,15 4,15 0,20" fill="#f43f5e"/>
        <path d="M -6 24 Q 0 28 6 24" stroke="#e2e8f0" stroke-width="2" fill="none"/>

        <!-- Whiskers -->
        <line x1="-30" y1="15" x2="-65" y2="8" stroke="#94a3b8" stroke-width="1.5"/>
        <line x1="-30" y1="20" x2="-60" y2="22" stroke="#94a3b8" stroke-width="1.5"/>
        <line x1="30" y1="15" x2="65" y2="8" stroke="#94a3b8" stroke-width="1.5"/>
        <line x1="30" y1="20" x2="60" y2="22" stroke="#94a3b8" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Animated Stats Bar -->
    <g transform="translate(680, 630)">
      <rect width="540" height="55" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text class="text-mono" x="25" y="33" font-size="14" fill="#94a3b8">AUTOMATION: 98%</text>
      <rect x="175" y="20" width="330" height="16" rx="8" fill="#0f172a"/>
      <rect x="175" y="20" width="320" height="16" rx="8" fill="url(#name-grad)">
        <animate attributeName="width" values="0;320" dur="2s" fill="freeze"/>
      </rect>
    </g>

    <!-- Holographic Continuous Full-Width Horizontal Scan Line -->
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#00f3ff" stroke-width="3" filter="url(#scan-glow)" opacity="0.75" class="scan-line" />
  </g>
</svg>
